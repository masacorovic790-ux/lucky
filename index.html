<script>
let currentIdx = 1;
let selectedActivity = "Neka magija";
let noScaleNum = 1.0;
let yesScaleNum = 1.0;
let noMsgCount = 0;

// PAGE SWITCH
function goToPage(n) {
  const oldPage = document.getElementById(`page-${currentIdx}`);
  const newPage = document.getElementById(`page-${n}`);
  if (!oldPage || !newPage) return;

  oldPage.classList.add('out');
  setTimeout(() => {
    oldPage.classList.remove('active', 'out');
  }, 500);

  setTimeout(() => {
    newPage.classList.add('active');
  }, 280);

  currentIdx = n;
}

// CONFETTI
function launchConfettiEffect() {
  const canv = document.getElementById('confetti-layer');
  canv.width = window.innerWidth;
  canv.height = window.innerHeight;

  let particles = [];
  for (let i = 0; i < 140; i++) {
    particles.push({
      x: Math.random() * canv.width,
      y: -10 - Math.random() * 50,
      vx: (Math.random() - 0.5) * 4,
      vy: Math.random() * 4 + 2,
      size: Math.random() * 7 + 4,
      color: ['#e8637a','#f4a0b0','#4ec9b0','#ffcf9a'][Math.floor(Math.random()*4)],
      rot: Math.random() * 360,
      spin: (Math.random() - 0.5) * 6
    });
  }

  function animate() {
    const ctx = canv.getContext('2d');
    ctx.clearRect(0, 0, canv.width, canv.height);

    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.1;
      p.rot += p.spin;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
      ctx.restore();
    });

    requestAnimationFrame(animate);
  }

  animate();
}

// YES BUTTON
function yesHandler() {
  launchConfettiEffect();
  goToPage(2);
}

// NO BUTTON (shrinks + yes grows)
function noHoverEffect() {
  noScaleNum = Math.max(0.4, noScaleNum - 0.1);
  yesScaleNum += 0.1;

  const noBtn = document.getElementById("btn-no");
  const yesBtn = document.getElementById("btn-yes");

  noBtn.style.transform = `scale(${noScaleNum})`;
  yesBtn.style.transform = `scale(${yesScaleNum})`;
}

// NO CLICK (optional message)
function noClickHandler() {
  const messages = [
    "Sigurna si? 😢",
    "Razmisli još malo 🥺",
    "Biće baš lepo 💕",
    "Ajde plsss 😭"
  ];

  alert(messages[noMsgCount % messages.length]);
  noMsgCount++;
}

// ACTIVITY SELECT
document.querySelectorAll(".activity-card").forEach(card => {
  card.addEventListener("click", () => {
    selectedActivity = card.getAttribute("data-act");

    document.querySelectorAll(".activity-card").forEach(c => {
      c.style.borderColor = "rgba(232,99,122,0.3)";
    });

    card.style.borderColor = "#4ec9b0";

    setTimeout(() => {
      goToPage(4);
    }, 500);
  });
});

// DATE LIMIT (today → future only)
const dateInput = document.getElementById("date-input");
if (dateInput) {
  const today = new Date().toISOString().split("T")[0];
  dateInput.min = today;
}

// FINAL STEP
function finalizeDate() {
  const date = document.getElementById("date-input").value;
  const time = document.getElementById("time-input").value;

  if (!date || !time) {
    alert("Izaberi datum i vreme 💕");
    return;
  }

  const display = document.getElementById("date-display");
  display.innerText = `📅 ${date} u ${time} • ${selectedActivity}`;

  goToPage(5);
}
</script>
