<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnaVoliMilovana 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --rose: #e8637a; --rose-light: #f4a0b0; --rose-dark: #c0415a;
    --teal: #4ec9b0; --teal-dark: #2da891;
    --bg-dark: #0d0a14; --bg-mid: #1a0f22;
    --text-soft: #f7e8ec; --text-muted: #c9a8b4;
  }
  html, body { width:100%; height:100%; background:var(--bg-dark); color:var(--text-soft); font-family:'Lato',sans-serif; overflow:hidden; }
  #bg-canvas { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .page { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem; opacity:0; pointer-events:none; transition:opacity 0.7s ease, transform 0.7s ease; transform:scale(0.96); z-index:10; text-align:center; }
  .page.active { opacity:1; pointer-events:all; transform:scale(1); }
  .page.out { opacity:0; transform:scale(1.04); pointer-events:none; }
  h1 { font-family:'Playfair Display',serif; font-size:clamp(1.8rem,5vw,3rem); color:var(--text-soft); line-height:1.25; margin-bottom:1rem; text-shadow:0 0 30px rgba(232,99,122,0.4); }
  h2 { font-family:'Playfair Display',serif; font-size:clamp(1.3rem,3.5vw,2rem); color:var(--rose-light); margin-bottom:0.5rem; }
  p { color:var(--text-muted); font-size:clamp(0.9rem,2.5vw,1.1rem); line-height:1.7; margin-bottom:1rem; font-weight:300; }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:14px 36px; border-radius:50px; border:none; cursor:pointer; font-family:'Lato',sans-serif; font-size:1rem; font-weight:400; letter-spacing:0.5px; transition:transform 0.2s ease, box-shadow 0.2s ease, background 0.2s; position:relative; text-decoration:none; }
  .btn-yes { background:linear-gradient(135deg,var(--rose),var(--rose-dark)); color:white; box-shadow:0 4px 24px rgba(232,99,122,0.5); }
  .btn-yes:hover { transform:translateY(-2px) scale(1.04); box-shadow:0 8px 36px rgba(232,99,122,0.7); }
  .btn-no { background:transparent; color:var(--text-muted); border:1px solid rgba(201,168,180,0.3); }
  .btn-no:hover { background:rgba(255,255,255,0.04); }
  .btn-soft { background:rgba(232,99,122,0.15); color:var(--rose-light); border:1px solid rgba(232,99,122,0.3); }
  .btn-soft:hover { background:rgba(232,99,122,0.28); transform:translateY(-2px); box-shadow:0 4px 20px rgba(232,99,122,0.3); }
  .btn-teal { background:linear-gradient(135deg,var(--teal),var(--teal-dark)); color:#0d1a18; box-shadow:0 4px 20px rgba(78,201,176,0.4); }
  .btn-row { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin-top:2rem; }

  /* ── TULIP GARDEN PAGE 1 ── */
  #tulip-garden { position:relative; width:min(90vw,420px); height:200px; margin-bottom:1rem; }
  .tulip-wrap { position:absolute; bottom:0; display:flex; flex-direction:column; align-items:center; transform-origin:bottom center; }
  @keyframes sway { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(6deg)} }
  @keyframes sway2 { 0%,100%{transform:rotate(5deg)} 50%{transform:rotate(-5deg)} }
  @keyframes sway3 { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(8deg)} }
  @keyframes sway4 { 0%,100%{transform:rotate(7deg)} 50%{transform:rotate(-3deg)} }
  @keyframes sway5 { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(6deg)} }
  @keyframes sway6 { 0%,100%{transform:rotate(4deg)} 50%{transform:rotate(-7deg)} }
  @keyframes sway7 { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(4deg)} }
  @keyframes bloom { 0%{transform:scaleY(0) scaleX(0.3); opacity:0} 60%{transform:scaleY(1.15) scaleX(1.05)} 100%{transform:scale(1); opacity:1} }
  .tulip-wrap:nth-child(1) { left:5%;  animation:sway  3.2s ease-in-out infinite; animation-delay:0s; }
  .tulip-wrap:nth-child(2) { left:17%; animation:sway2 3.8s ease-in-out infinite; animation-delay:0.3s; }
  .tulip-wrap:nth-child(3) { left:29%; animation:sway3 3.5s ease-in-out infinite; animation-delay:0.6s; }
  .tulip-wrap:nth-child(4) { left:41%; animation:sway4 4.1s ease-in-out infinite; animation-delay:0.2s; }
  .tulip-wrap:nth-child(5) { left:53%; animation:sway  3.6s ease-in-out infinite; animation-delay:0.8s; }
  .tulip-wrap:nth-child(6) { left:65%; animation:sway5 3.3s ease-in-out infinite; animation-delay:0.4s; }
  .tulip-wrap:nth-child(7) { left:77%; animation:sway6 4.0s ease-in-out infinite; animation-delay:1.0s; }
  .tulip-wrap:nth-child(8) { left:89%; animation:sway7 3.7s ease-in-out infinite; animation-delay:0.1s; }
  .tulip-head { animation:bloom 1.2s cubic-bezier(0.175,0.885,0.32,1.275) both; transform-origin:bottom center; }
  .tulip-wrap:nth-child(1) .tulip-head { animation-delay:0.1s }
  .tulip-wrap:nth-child(2) .tulip-head { animation-delay:0.25s }
  .tulip-wrap:nth-child(3) .tulip-head { animation-delay:0.4s }
  .tulip-wrap:nth-child(4) .tulip-head { animation-delay:0.55s }
  .tulip-wrap:nth-child(5) .tulip-head { animation-delay:0.7s }
  .tulip-wrap:nth-child(6) .tulip-head { animation-delay:0.85s }
  .tulip-wrap:nth-child(7) .tulip-head { animation-delay:1.0s }
  .tulip-wrap:nth-child(8) .tulip-head { animation-delay:1.15s }

  /* ── STICKER GRID PAGE 2 ── */
  .sticker-grid { display:flex; flex-wrap:wrap; justify-content:center; gap:16px; margin:1.5rem 0; max-width:420px; }
  .sticker-item { background:rgba(255,255,255,0.06); border:1px solid rgba(232,99,122,0.2); border-radius:20px; padding:12px; animation:popIn 0.6s cubic-bezier(0.175,0.885,0.32,1.275) both; transition:transform 0.2s; cursor:default; }
  .sticker-item:hover { transform:scale(1.08) rotate(-2deg); }
  .sticker-item img { width:90px; height:90px; object-fit:contain; display:block; }
  .sticker-item:nth-child(1) { animation-delay:0.1s }
  .sticker-item:nth-child(2) { animation-delay:0.25s }
  .sticker-item:nth-child(3) { animation-delay:0.4s }
  .sticker-item:nth-child(4) { animation-delay:0.55s }
  .sticker-item:nth-child(5) { animation-delay:0.7s }
  .sticker-item:nth-child(6) { animation-delay:0.85s }
  @keyframes popIn { 0%{transform:scale(0) rotate(-10deg)} 100%{transform:scale(1) rotate(0deg)} }

  /* ── ACTIVITY CARDS ── */
  .activity-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:420px; width:100%; margin-top:1.5rem; }
  @media(max-width:500px){ .activity-grid{ grid-template-columns:repeat(2,1fr); } }
  .activity-card { background:rgba(255,255,255,0.04); border:1px solid rgba(232,99,122,0.2); border-radius:16px; padding:18px 10px; cursor:pointer; transition:all 0.25s ease; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .activity-card:hover { background:rgba(232,99,122,0.12); border-color:rgba(232,99,122,0.5); transform:translateY(-3px); box-shadow:0 6px 20px rgba(232,99,122,0.2); }
  .activity-card .icon { font-size:1.8rem; }
  .activity-card .label { font-size:0.82rem; color:var(--text-muted); font-weight:300; text-align:center; }

  /* ── DATE PICKER ── */
  .date-wrap { display:flex; flex-direction:column; gap:16px; align-items:center; margin-top:1.5rem; width:100%; max-width:320px; }
  .date-wrap input { width:100%; background:rgba(255,255,255,0.06); border:1px solid rgba(232,99,122,0.3); border-radius:12px; color:var(--text-soft); font-family:'Lato',sans-serif; font-size:1rem; padding:14px 18px; outline:none; transition:border-color 0.2s; color-scheme:dark; }
  .date-wrap input:focus { border-color:var(--rose); }
  .date-wrap label { font-size:0.85rem; color:var(--text-muted); align-self:flex-start; letter-spacing:0.5px; text-transform:uppercase; font-weight:300; }

  /* ── FINAL PAGE ── */
  .final-messages { display:flex; flex-direction:column; gap:12px; margin-top:1.5rem; }
  .final-msg { background:rgba(232,99,122,0.1); border:1px solid rgba(232,99,122,0.25); border-radius:20px; padding:14px 24px; font-family:'Playfair Display',serif; font-style:italic; font-size:clamp(1rem,2.5vw,1.2rem); color:var(--rose-light); animation:slideUp 0.6s ease both; }
  .final-msg:nth-child(1){ animation-delay:0.1s }
  .final-msg:nth-child(2){ animation-delay:0.35s }
  .final-msg:nth-child(3){ animation-delay:0.6s }
  @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  #confetti-layer { position:fixed; inset:0; pointer-events:none; z-index:5; }
  #btn-no { transition:all 0.3s ease; }
  #btn-yes { transition:all 0.3s ease; }

  /* email status */
  #email-status { font-size:0.8rem; color:var(--teal); margin-top:0.5rem; min-height:1.2em; }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<canvas id="confetti-layer"></canvas>

<!-- PAGE 1 -->
<div class="page active" id="page-1">
  <div id="tulip-garden">

      <svg width="7" height="80" viewBox="0 0 7 80"><path d="M3.5 80 Q1 55 3.5 0" stroke="#2da891" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="0" cy="58" rx="11" ry="5" fill="#5dd8b0" transform="rotate(-30 0 58)"/></svg>

      <svg width="10" height="130" viewBox="0 0 10 130"><path d="M5 130 Q8 88 5 0" stroke="#3daf8e" stroke-width="4.5" fill="none" stroke-linecap="round"/><ellipse cx="9" cy="95" rx="16" ry="7" fill="#4ec9a0" transform="rotate(45 9 95)"/><ellipse cx="0" cy="75" rx="13" ry="5.5" fill="#4ec9a0" transform="rotate(-35 0 75)"/></svg>

      <svg class="tulip-head" width="40" height="62" viewBox="0 0 40 62"><defs><radialGradient id="t5" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#ffa8c0"/><stop offset="100%" stop-color="#d03060"/></radialGradient></defs><ellipse cx="10" cy="44" rx="9.5" ry="24" fill="url(#t5)" transform="rotate(-14 10 44)"/><ellipse cx="20" cy="40" rx="10" ry="26" fill="url(#t5)"/><ellipse cx="30" cy="44" rx="9.5" ry="24" fill="url(#t5)" transform="rotate(14 30 44)"/></svg>
      <svg width="8" height="95" viewBox="0 0 8 95"><path d="M4 95 Q2 64 4 0" stroke="#2da891" stroke-width="3.5" fill="none" stroke-linecap="round"/><ellipse cx="0" cy="70" rx="12" ry="5" fill="#5dd8b0" transform="rotate(-38 0 70)"/></svg>

    <div class="tulip-wrap">
      <svg class="tulip-head" width="34" height="52" viewBox="0 0 34 52"><defs><radialGradient id="t6" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#ffd6e4"/><stop offset="100%" stop-color="#e8637a"/></radialGradient></defs><ellipse cx="8" cy="37" rx="8" ry="19" fill="url(#t6)" transform="rotate(-10 8 37)"/><ellipse cx="17" cy="34" rx="8" ry="21" fill="url(#t6)"/><ellipse cx="26" cy="37" rx="8" ry="19" fill="url(#t6)" transform="rotate(10 26 37)"/></svg>

  <h1>Da li želiš da se vidimo? 💕</h1>

</div>

<!-- PAGE 2 -->
<div class="page" id="page-2">
  <h1 style="margin-bottom:0.5rem">JEEEEEEEEEEEEEEEEJ!!!</h1>

<script>
let currentPage = 1;
let noScale = 1.0, yesScale = 1.0, noClickCount = 0;
let selectedActivity = '';

function goTo(n) {
  const cur = document.getElementById('page-' + currentPage);
  const next = document.getElementById('page-' + n);
  cur.classList.add('out');
  setTimeout(() => { cur.classList.remove('active','out'); }, 600);
  setTimeout(() => { next.classList.add('active'); }, 300);
  currentPage = n;
}

function noHover() {
  noScale = Math.max(0.4, noScale - 0.08);
  yesScale = Math.min(1.5, yesScale + 0.06);
  document.getElementById('btn-no').style.transform = `scale(${noScale})`;
  document.getElementById('btn-no').style.opacity = noScale;
  document.getElementById('btn-yes').style.transform = `scale(${yesScale})`;
}

function noClick() {
  noClickCount++;
  const msgs = ['Neeee','reci da','Sigurno? ','Molim te','RECI DA'];
  document.getElementById('btn-no').textContent = msgs[Math.min(noClickCount-1, msgs.length-1)];
  noHover();
}

function yesClick() { launchConfetti(); goTo(2); }

function pickActivity(act) {
  selectedActivity = act;
  document.getElementById('chosen-activity').textContent = '✨ ' + act;
  goTo(4);
}

(function setMinDate() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('date-input').min = today;
  document.getElementById('date-input').value = today;
})();

function confirmDate() {
  const d = document.getElementById('date-input').value;
  const t = document.getElementById('time-input').value;
  if (!d) return;
  const dateObj = new Date(d + 'T' + t);
  const opts = {weekday:'long',year:'numeric',month:'long',day:'numeric'};
  const dStr = dateObj.toLocaleDateString('sr-Latn-RS', opts);
  document.getElementById('date-display').textContent = selectedActivity + ' · ' + dStr + ' u ' + t + 'h';
  launchConfetti();
  goTo(5);
  sendEmailNotification(selectedActivity, dStr, t);
}

async function sendEmailNotification(activity, dateStr, time) {
  const statusEl = document.getElementById('email-status');
  statusEl.textContent = '📧 Šaljem obaveštenje...';
  try {
    const formData = new FormData();
    formData.append('access_key', '9cedd083-cf40-4eaf-901e-bd9a2d28c38b'); // <- Zameni sa kljucem sa https://web3forms.com
    formData.append('to', 'masacorovic790@gmail.com');
    formData.append('subject', '💕 Neko je prihvatio tvoj poziv na dejt!');
    formData.append('message',
      'Hej! Neko je prihvatio tvoj romantičan poziv na stranicu i evo šta je izabrao:\n\n' +
      '💝 Aktivnost: ' + activity + '\n' +
      '📅 Datum: ' + dateStr + '\n' +
      '🕐 Vreme: ' + time + 'h\n\n' +
      'Vreme slanja: ' + new Date().toLocaleString('sr-Latn-RS') + '\n\nSreća! 💕'
    );
    const res = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      body: formData
    });
    const data = await res.json();
    if (data.success) {
      statusEl.textContent = '✅ Obaveštenje poslato! 💌';
    } else {
      statusEl.textContent = '💌 Dogovor je napravljen!';
    }
  } catch(e) {
    statusEl.textContent = '💌 Dogovor je napravljen!';
  }
}

// ── BACKGROUND ──
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
let stars = [], floatingHearts = [];

function resizeBg() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
  initStars();
}

function initStars() {
  stars = [];
  for (let i=0;i<160;i++) stars.push({x:Math.random()*bgCanvas.width,y:Math.random()*bgCanvas.height,r:Math.random()*1.5+0.3,a:Math.random(),speed:Math.random()*0.003+0.001,phase:Math.random()*Math.PI*2});
  floatingHearts = [];
  for (let i=0;i<18;i++) spawnHeart();
}

function spawnHeart() {
  floatingHearts.push({x:Math.random()*bgCanvas.width,y:bgCanvas.height+20,size:Math.random()*16+8,speedY:Math.random()*0.8+0.4,speedX:(Math.random()-0.5)*0.5,alpha:Math.random()*0.4+0.15,wobble:Math.random()*Math.PI*2,wobbleSpeed:Math.random()*0.03+0.01});
}

function drawHeart(ctx,x,y,size,alpha) {
  ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle='#e8637a';
  const s=size/2;
  ctx.beginPath();
  ctx.moveTo(x,y+s*0.4);
  ctx.bezierCurveTo(x,y,x-s,y,x-s,y-s*0.5);
  ctx.bezierCurveTo(x-s,y-s*1.2,x,y-s*1.2,x,y-s*0.5);
  ctx.bezierCurveTo(x,y-s*1.2,x+s,y-s*1.2,x+s,y-s*0.5);
  ctx.bezierCurveTo(x+s,y,x,y,x,y+s*0.4);
  ctx.fill(); ctx.restore();
}

function bgLoop(t) {
  bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
  const grad=bgCtx.createRadialGradient(bgCanvas.width*.5,bgCanvas.height*.4,0,bgCanvas.width*.5,bgCanvas.height*.5,bgCanvas.width*.8);
  grad.addColorStop(0,'#1a0f22'); grad.addColorStop(0.6,'#110918'); grad.addColorStop(1,'#0d0a14');
  bgCtx.fillStyle=grad; bgCtx.fillRect(0,0,bgCanvas.width,bgCanvas.height);
  stars.forEach(s=>{s.a=0.3+0.7*(0.5+0.5*Math.sin(t*s.speed+s.phase));bgCtx.save();bgCtx.globalAlpha=s.a;bgCtx.fillStyle='#f7e8ec';bgCtx.beginPath();bgCtx.arc(s.x,s.y,s.r,0,Math.PI*2);bgCtx.fill();bgCtx.restore();});
  floatingHearts.forEach((h,i)=>{h.y-=h.speedY;h.wobble+=h.wobbleSpeed;h.x+=Math.sin(h.wobble)*0.4+h.speedX;drawHeart(bgCtx,h.x,h.y,h.size,h.alpha);if(h.y<-30)floatingHearts[i]={x:Math.random()*bgCanvas.width,y:bgCanvas.height+20,size:Math.random()*16+8,speedY:Math.random()*0.8+0.4,speedX:(Math.random()-0.5)*0.5,alpha:Math.random()*0.4+0.15,wobble:Math.random()*Math.PI*2,wobbleSpeed:Math.random()*0.03+0.01};});
  requestAnimationFrame(bgLoop);
}

const confCanvas = document.getElementById('confetti-layer');
const confCtx = confCanvas.getContext('2d');
let confParticles=[], confActive=false;

function launchConfetti() {
  confCanvas.width=window.innerWidth; confCanvas.height=window.innerHeight;
  confParticles=[];
  for(let i=0;i<120;i++) confParticles.push({x:Math.random()*confCanvas.width,y:-10,vx:(Math.random()-0.5)*4,vy:Math.random()*4+2,color:['#e8637a','#f4a0b0','#4ec9b0','#ffd580','#c0415a','#ffffff'][Math.floor(Math.random()*6)],size:Math.random()*8+4,rot:Math.random()*360,rotV:(Math.random()-.5)*6});
  confActive=true; animConf();
}

function animConf() {
  if(!confActive) return;
  confCtx.clearRect(0,0,confCanvas.width,confCanvas.height);
  let alive=0;
  confParticles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.rot+=p.rotV;if(p.y<confCanvas.height+20){alive++;confCtx.save();confCtx.translate(p.x,p.y);confCtx.rotate(p.rot*Math.PI/180);confCtx.fillStyle=p.color;confCtx.globalAlpha=Math.max(0,1-p.y/confCanvas.height);confCtx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);confCtx.restore();}});
  if(alive>0) requestAnimationFrame(animConf);
  else { confActive=false; confCtx.clearRect(0,0,confCanvas.width,confCanvas.height); }
}

window.addEventListener('resize',()=>{resizeBg();confCanvas.width=window.innerWidth;confCanvas.height=window.innerHeight;});
resizeBg();
requestAnimationFrame(bgLoop);
</script>
