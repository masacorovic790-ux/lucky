

<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lucky</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
}

:root{
  --rose:#e8637a;
  --rose-light:#f4a0b0;
  --rose-dark:#c0415a;
  --teal:#4ec9b0;
  --bg-deep:#0d0a14;
  --text-glow:#f7e8ec;
  --text-muted:#c9a8b4;
}

body{
  background:var(--bg-deep);
  font-family:'Lato',sans-serif;
  overflow:hidden;
  height:100vh;
  color:var(--text-glow);
}

#bg-canvas,
#confetti-layer{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

#confetti-layer{
  z-index:15;
}

.page{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:1.8rem;
  opacity:0;
  pointer-events:none;
  transition:0.5s;
  transform:scale(0.96);
  text-align:center;
  z-index:10;
}

.page.active{
  opacity:1;
  pointer-events:auto;
  transform:scale(1);
}

h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(2rem,7vw,3rem);
  margin-bottom:1rem;
  background:linear-gradient(135deg,#fff0f3,var(--rose-light));
  -webkit-background-clip:text;
  color:transparent;
}

h2{
  font-family:'Playfair Display',serif;
  color:var(--rose-light);
  margin-bottom:0.7rem;
  font-size:2rem;
}

p{
  color:var(--text-muted);
  max-width:350px;
  line-height:1.6;
}

.btn{
  border:none;
  border-radius:999px;
  padding:14px 30px;
  font-size:1rem;
  cursor:pointer;
  transition:0.25s;
  font-weight:700;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-yes{
  background:linear-gradient(135deg,var(--rose),var(--rose-dark));
  color:white;
  box-shadow:0 10px 24px rgba(232,99,122,0.45);
}

.btn-no{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(232,99,122,0.35);
  color:white;
}

.btn-soft{
  background:rgba(232,99,122,0.2);
  border:1px solid rgba(232,99,122,0.35);
  color:white;
}

.btn-row{
  display:flex;
  gap:18px;
  margin-top:2rem;
  flex-wrap:wrap;
  justify-content:center;
}

.yay-image-wrap{
  width:min(220px,62vw);
  aspect-ratio:1;
  margin:0.4rem 0 1.4rem;
  border-radius:32px;
  overflow:hidden;
  background:#f6f6f6;
  box-shadow:0 18px 48px rgba(232,99,122,0.32);
}

.yay-image{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

.activity-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  width:100%;
  max-width:420px;
  margin-top:2rem;
}

.activity-card{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(232,99,122,0.3);
  border-radius:28px;
  padding:18px 8px;
  cursor:pointer;
  transition:0.25s;
}

.activity-card:hover{
  transform:translateY(-4px);
  background:rgba(232,99,122,0.16);
}

.activity-card.selected{
  background:rgba(232,99,122,0.35);
  border-color:var(--teal);
}

.icon{
  font-size:2rem;
  margin-bottom:6px;
}

.label{
  color:white;
  font-size:0.9rem;
}

.modern-date-wrap{
  width:100%;
  max-width:360px;
  margin-top:2rem;
  display:flex;
  flex-direction:column;
  gap:1.4rem;
}

.quick-days{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.quick-day{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(232,99,122,0.3);
  color:white;
  border-radius:22px;
  padding:14px 10px;
  cursor:pointer;
  transition:0.25s;
}

.quick-day:hover{
  background:rgba(232,99,122,0.2);
}

.date-box,
.custom-time-wrap{
  text-align:left;
}

.date-box label,
.custom-time-wrap label{
  display:block;
  margin-bottom:8px;
  color:var(--rose-light);
  font-size:0.8rem;
}

.date-box input,
.custom-time-wrap input{
  width:100%;
  padding:16px;
  border-radius:24px;
  border:1px solid rgba(232,99,122,0.3);
  background:rgba(255,255,255,0.05);
  color:white;
  font-size:1rem;
  outline:none;
}

.time-title{
  color:var(--rose-light);
  font-weight:700;
}

.time-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.time-chip{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(232,99,122,0.25);
  color:white;
  border-radius:20px;
  padding:14px 8px;
  cursor:pointer;
  transition:0.25s;
}

.time-chip.active{
  background:linear-gradient(135deg,var(--rose),var(--rose-dark));
}

.confirm-btn{
  width:100%;
}

#email-status{
  min-height:1.4rem;
  margin-top:1rem;
  color:var(--rose-light);
}

.final-messages{
  margin-top:2rem;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.final-msg{
  background:rgba(232,99,122,0.1);
  border:1px solid rgba(232,99,122,0.25);
  padding:14px 22px;
  border-radius:999px;
  color:var(--rose-light);
  font-family:'Playfair Display',serif;
}

#no-msg{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(232,99,122,0.2);
  padding:10px 20px;
  border-radius:999px;
  color:white;
  opacity:0;
  transition:0.4s;
  z-index:50;
}

#no-msg.show{
  opacity:1;
}
</style>
</head>

<body>

<canvas id="bg-canvas"></canvas>
<canvas id="confetti-layer"></canvas>

<div id="no-msg"></div>

<div class="page active" id="page-1">

<h1>Da li želiš da se vidimo?</h1>

<div class="btn-row">
<button class="btn btn-yes" onclick="yesHandler()">Da! 🫶</button>
<button class="btn btn-no" id="btn-no" onmouseover="noHoverEffect()" onclick="noClickHandler()">Ne 💔</button>
</div>

</div>

<div class="page" id="page-2">

<h1>JEEEEJ!!!</h1>

<div class="yay-image-wrap">
<img class="yay-image" alt="Jeeeej slika" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 240'%3E%3Crect width='240' height='240' fill='%23f7f7f7'/%3E%3Cg fill='none' stroke='%23000' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M81 217c7-25 2-51 7-73'/%3E%3Cpath d='M159 217c-7-25-2-51-7-73'/%3E%3Cpath d='M82 217c12-16 27-25 38-25s26 9 38 25'/%3E%3Cpath d='M89 139c-34-13-54-41-48-73 7-38 44-56 79-51 37 5 70 28 73 66 2 28-15 51-43 63'/%3E%3Cpath d='M104 111c6 7 13 10 20 10s14-4 19-11'/%3E%3Cpath d='M120 117c-2 10-2 16 2 22'/%3E%3C/g%3E%3Cellipse cx='83' cy='77' rx='31' ry='34' transform='rotate(-20 83 77)' fill='%23000'/%3E%3Cellipse cx='153' cy='74' rx='28' ry='32' transform='rotate(18 153 74)' fill='%23000'/%3E%3Cellipse cx='74' cy='66' rx='9' ry='12' fill='%23fff'/%3E%3Cellipse cx='94' cy='83' rx='7' ry='8' fill='%23fff'/%3E%3Cellipse cx='144' cy='62' rx='8' ry='11' fill='%23fff'/%3E%3Cellipse cx='164' cy='79' rx='7' ry='8' fill='%23fff'/%3E%3Cellipse cx='77' cy='120' rx='18' ry='8' fill='%23ff8fa3' transform='rotate(8 77 120)'/%3E%3Cellipse cx='166' cy='117' rx='18' ry='8' fill='%23ff8fa3' transform='rotate(-8 166 117)'/%3E%3C/svg%3E">
</div>

<button class="btn btn-soft" style="margin-top:1rem;" onclick="goToPage(3)">
Znala sam da ćeš reći da...
</button>

</div>

<div class="page" id="page-3">

<h2>Šta želiš da radimo?</h2>

<div class="activity-grid">

<div class="activity-card" data-act="DIY veče 🎨" onclick="selectActivity(this)">
<div class="icon">🎨</div>
<div class="label">DIY veče</div>
</div>

<div class="activity-card" data-act="Večera 🍝" onclick="selectActivity(this)">
<div class="icon">🍝</div>
<div class="label">Večera</div>
</div>

<div class="activity-card" data-act="Šetnja 🌙" onclick="selectActivity(this)">
<div class="icon">🌙</div>
<div class="label">Šetnja</div>
</div>

<div class="activity-card" data-act="Bilijar 🎱" onclick="selectActivity(this)">
<div class="icon">🎱</div>
<div class="label">Bilijar</div>
</div>

<div class="activity-card" data-act="Film 🍿" onclick="selectActivity(this)">
<div class="icon">🎬</div>
<div class="label">Film</div>
</div>

<div class="activity-card" data-act="Nešto drugo..." onclick="selectActivity(this)">
<div class="icon">✅</div>
<div class="label">Iznenađenje</div>
</div>

</div>

</div>

<div class="page" id="page-4">

<h2>🗓️ Kada si slobodna?</h2>

<p>Izaberi datum i vreme 💫</p>

<div class="modern-date-wrap">

<div class="quick-days">
<button class="quick-day" onclick="pickQuickDay(0)">Danas</button>
<button class="quick-day" onclick="pickQuickDay(1)">Sutra</button>
<button class="quick-day" onclick="pickQuickDay(3)">Za 3 dana</button>
<button class="quick-day" onclick="pickQuickDay(7)">Sledeće nedelje</button>
</div>

<div class="date-box">
<label>📅 Datum</label>
<input type="date" id="date-input">
</div>

<div class="time-title">
⏰ Izaberi vreme
</div>

<div class="time-grid">
<button class="time-chip" onclick="pickTime(this,'16:00')">16:00</button>
<button class="time-chip" onclick="pickTime(this,'18:00')">18:00</button>
<button class="time-chip active" onclick="pickTime(this,'19:00')">19:00</button>
<button class="time-chip" onclick="pickTime(this,'20:00')">20:00</button>
<button class="time-chip" onclick="pickTime(this,'21:00')">21:00</button>
<button class="time-chip" onclick="pickTime(this,'22:00')">22:00</button>
</div>

<div class="custom-time-wrap">
<label>ili unesi svoje vreme</label>
<input type="time" id="time-input" value="19:00">
</div>

<button class="btn btn-yes confirm-btn" onclick="finalizeDate()">
Potvrdi 🙏🏻
</button>

</div>

<div id="email-status"></div>

</div>

<div class="page" id="page-5">

<h1>Dogovoreno!</h1>

<p id="date-display" style="margin-top:1rem;color:var(--rose-light);"></p>

<div class="final-messages">
<div class="final-msg">Jedva čekam da te vidim 🥰</div>
</div>

</div>

<script>

let currentIdx = 1;
let selectedActivity = "Dejt 💖";

const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzZWoIf1LKukAact-AjpuDZvFwa-TsfaGky_MoUe8JN1C3ylCkWo53K_n6Cl6zio86X/exec";

const noMessages = [
  "Ne možeš pobeći",
  "klikni DA",
  "Sigurna? 😏",
  "KLIKNI DA"
];

let noCount = 0;

const today = new Date().toISOString().split('T')[0];
document.getElementById('date-input').min = today;

function goToPage(n){
  document.querySelectorAll('.page').forEach(p=>{
    p.classList.remove('active');
  });

  document.getElementById('page-'+n).classList.add('active');
  currentIdx = n;
}

function yesHandler(){
  launchConfetti();
  goToPage(2);
}

function noHoverEffect(){
  const btn = document.getElementById('btn-no');

  const maxX = window.innerWidth - 120;
  const maxY = window.innerHeight - 60;

  btn.style.position='fixed';
  btn.style.left=Math.random()*maxX+'px';
  btn.style.top=Math.random()*maxY+'px';
}

function noClickHandler(){
  const msg = document.getElementById('no-msg');

  msg.textContent = noMessages[Math.min(noCount,noMessages.length-1)];
  msg.classList.add('show');

  setTimeout(()=>{
    msg.classList.remove('show');
  },2000);

  noCount++;
}

function selectActivity(card){
  document.querySelectorAll('.activity-card').forEach(c=>{
    c.classList.remove('selected');
  });

  card.classList.add('selected');
  selectedActivity = card.dataset.act;

  setTimeout(()=>{
    goToPage(4);
  },400);
}

function pickQuickDay(daysAhead){
  const d = new Date();
  d.setDate(d.getDate()+daysAhead);

  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');

  document.getElementById('date-input').value = `${yyyy}-${mm}-${dd}`;
}

function pickTime(btn,time){
  document.querySelectorAll('.time-chip').forEach(chip=>{
    chip.classList.remove('active');
  });

  btn.classList.add('active');
  document.getElementById('time-input').value = time;
}

async function sendAnswer(answer){
  if(!GOOGLE_SCRIPT_URL){
    return;
  }

  try{
    await fetch(GOOGLE_SCRIPT_URL,{
  method:'POST',
  headers:{
    'Content-Type':'application/json'
  },
  body: JSON.stringify(answer)
});
  }catch(error){
    console.error('Slanje odgovora nije uspelo:',error);
  }
}

function finalizeDate(){
  const dateVal = document.getElementById('date-input').value;
  const timeVal = document.getElementById('time-input').value;
  const emailStatus = document.getElementById('email-status');

  if(!dateVal){
    emailStatus.textContent = '💗 Izaberi datum!';
    return;
  }

  const dateObj = new Date(dateVal+'T'+timeVal);

  const formattedDate = dateObj.toLocaleDateString('sr-RS',{
    weekday:'long',
    year:'numeric',
    month:'long',
    day:'numeric'
  });

  const responseText = `${selectedActivity} · ${formattedDate} u ${timeVal}h`;

  document.getElementById('date-display').textContent = responseText;

  sendAnswer({
    activity:selectedActivity,
    date:dateVal,
    time:timeVal,
    formatted:responseText,
    sentAt:new Date().toISOString()
  });

  goToPage(5);
  launchConfetti();
}

function launchConfetti(){
  const canvas = document.getElementById('confetti-layer');

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const ctx = canvas.getContext('2d');
  const particles = [];

  for(let i=0;i<120;i++){
    particles.push({
      x:Math.random()*canvas.width,
      y:-20,
      vx:(Math.random()-0.5)*5,
      vy:Math.random()*5+2,
      size:Math.random()*8+4,
      rot:Math.random()*360
    });
  }

  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach(p=>{
      p.x += p.vx;
      p.y += p.vy;

      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = ['#e8637a','#f4a0b0','#4ec9b0'][Math.floor(Math.random()*3)];
      ctx.fillRect(0,0,p.size,p.size);
      ctx.restore();
    });

    requestAnimationFrame(animate);
  }

  animate();
}

(function(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');

  let w,h,dots=[];

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  function createDots(){
    dots=[];

    for(let i=0;i<90;i++){
      dots.push({
        x:Math.random()*w,
        y:Math.random()*h,
        r:Math.random()*2,
        vx:(Math.random()-0.5)*0.3,
        vy:(Math.random()-0.5)*0.3
      });
    }
  }

  function animate(){
    ctx.clearRect(0,0,w,h);

    dots.forEach(d=>{
      d.x += d.vx;
      d.y += d.vy;

      if(d.x<0)d.x=w;
      if(d.x>w)d.x=0;
      if(d.y<0)d.y=h;
      if(d.y>h)d.y=0;

      ctx.beginPath();
      ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
      ctx.fillStyle='rgba(232,99,122,0.45)';
      ctx.fill();
    });

    requestAnimationFrame(animate);
  }

  resize();
  createDots();
  animate();

  window.addEventListener('resize',()=>{
    resize();
    createDots();
  });
})();
</script>

</body>
</html>
