<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lucky</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
}

:root{
  --rose:#e8637a;
  --rose-light:#f4a0b0;
  --rose-dark:#c0415a;
  --teal:#4ec9b0;
  --bg-deep:#0d0a14;
  --text-glow:#f7e8ec;
  --text-muted:#c9a8b4;
}

/* ===== MOBILE FIX ===== */
html, body{
  height:100%;
  overflow:hidden;
}

body{
  background:var(--bg-deep);
  font-family:'Lato',sans-serif;
  color:var(--text-glow);
  position:fixed;
  width:100%;
  height:100%;
  -webkit-text-size-adjust:100%;
  touch-action:manipulation;
}

/* canvases */
#bg-canvas,
#confetti-layer{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

#confetti-layer{
  z-index:15;
}

/* ===== PAGES FIX ===== */
.page{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:1.8rem;
  opacity:0;
  pointer-events:none;
  transition:0.5s;
  transform:scale(0.96);
  text-align:center;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  min-height:100vh;
}

.page.active{
  opacity:1;
  pointer-events:auto;
  transform:scale(1);
  z-index:10;
}

/* FIX FINAL PAGE */
#page-5{
  justify-content:flex-start;
  padding-top:80px;
  padding-bottom:120px;
}

/* TEXT */
h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(2rem,7vw,3rem);
  margin-bottom:1rem;
  background:linear-gradient(135deg,#fff0f3,var(--rose-light));
  -webkit-background-clip:text;
  color:transparent;
}

h2{
  font-family:'Playfair Display',serif;
  color:var(--rose-light);
  margin-bottom:0.7rem;
  font-size:2rem;
}

p{
  color:var(--text-muted);
  max-width:350px;
  line-height:1.6;
}

/* BUTTONS */
.btn{
  border:none;
  border-radius:999px;
  padding:14px 30px;
  font-size:1rem;
  cursor:pointer;
  transition:0.25s;
  font-weight:700;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-yes{
  background:linear-gradient(135deg,var(--rose),var(--rose-dark));
  color:white;
  box-shadow:0 10px 24px rgba(232,99,122,0.45);
}

.btn-no{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(232,99,122,0.35);
  color:white;
}

.btn-soft{
  background:rgba(232,99,122,0.2);
  border:1px solid rgba(232,99,122,0.35);
  color:white;
}

.btn-row{
  display:flex;
  gap:18px;
  margin-top:2rem;
  flex-wrap:wrap;
  justify-content:center;
}

/* ACTIVITY GRID */
.activity-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  width:100%;
  max-width:420px;
  margin-top:2rem;
}

.activity-card{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(232,99,122,0.3);
  border-radius:28px;
  padding:18px 8px;
  cursor:pointer;
}

.activity-card.selected{
  background:rgba(232,99,122,0.35);
  border-color:var(--teal);
}

/* DATE */
.modern-date-wrap{
  width:100%;
  max-width:360px;
  margin-top:2rem;
  display:flex;
  flex-direction:column;
  gap:1.4rem;
}

.quick-days{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.quick-day{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(232,99,122,0.3);
  color:white;
  border-radius:22px;
  padding:14px 10px;
}

.date-box input,
.custom-time-wrap input{
  width:100%;
  padding:16px;
  border-radius:24px;
  border:1px solid rgba(232,99,122,0.3);
  background:rgba(255,255,255,0.05);
  color:white;
}

/* TIME */
.time-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.time-chip{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(232,99,122,0.25);
  color:white;
  border-radius:20px;
  padding:14px 8px;
}

.time-chip.active{
  background:linear-gradient(135deg,var(--rose),var(--rose-dark));
}

/* FINAL */
.final-messages{
  margin-top:2rem;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.final-msg{
  background:rgba(232,99,122,0.1);
  border:1px solid rgba(232,99,122,0.25);
  padding:14px 22px;
  border-radius:999px;
  color:var(--rose-light);
  font-family:'Playfair Display',serif;
}

#no-msg{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(232,99,122,0.2);
  padding:10px 20px;
  border-radius:999px;
  color:white;
  opacity:0;
  transition:0.4s;
  z-index:50;
}

#no-msg.show{
  opacity:1;
}
</style>
</head>

<body>

<canvas id="bg-canvas"></canvas>
<canvas id="confetti-layer"></canvas>

<div id="no-msg"></div>

<!-- PAGE 1 -->
<div class="page active" id="page-1">
<h1>Da li želiš da se vidimo?</h1>

<div class="btn-row">
<button class="btn btn-yes" onclick="yesHandler()">Da! 🫶</button>
<button class="btn btn-no" id="btn-no" onmouseover="noHoverEffect()">Ne 💔</button>
</div>
</div>

<!-- PAGE 2 -->
<div class="page" id="page-2">
<h1>JEEEEJ!!!</h1>

<button class="btn btn-soft" onclick="goToPage(3)">Nastavi</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="page-3">
<h2>Šta želiš da radimo?</h2>

<div class="activity-grid">
<div class="activity-card" onclick="selectActivity(this)" data-act="Večera 🍝">Večera</div>
<div class="activity-card" onclick="selectActivity(this)" data-act="Šetnja 🌙">Šetnja</div>
</div>
</div>

<!-- PAGE 4 -->
<div class="page" id="page-4">
<h2>Kada si slobodna?</h2>

<div class="date-box">
<input type="date" id="date-input">
</div>

<div class="time-grid">
<div class="time-chip active" onclick="pickTime(this,'19:00')">19:00</div>
<div class="time-chip" onclick="pickTime(this,'20:00')">20:00</div>
</div>

<button class="btn btn-yes" onclick="finalizeDate()">Potvrdi</button>
</div>

<!-- PAGE 5 -->
<div class="page" id="page-5">
<h1>Dogovoreno!</h1>

<p id="date-display"></p>

<div class="final-messages">
<div class="final-msg">Jedva čekam da te vidim 🥰</div>
</div>
</div>

<script>
let selectedActivity = "Dejt 💖";

function goToPage(n){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+n).classList.add('active');
}

function yesHandler(){
  goToPage(2);
}

function noHoverEffect(){
  const btn = document.getElementById('btn-no');
  btn.style.position='fixed';
  btn.style.left=Math.random()*200+'px';
  btn.style.top=Math.random()*200+'px';
}

function selectActivity(card){
  selectedActivity = card.dataset.act;
  goToPage(4);
}

function pickTime(el,time){
  document.querySelectorAll('.time-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
}

function finalizeDate(){
  const date = document.getElementById('date-input').value;
  const time = document.querySelector('.time-chip.active').textContent;

  document.getElementById('date-display').textContent =
    selectedActivity + " · " + date + " u " + time;

  goToPage(5);
}
</script>

</body>
</html>
